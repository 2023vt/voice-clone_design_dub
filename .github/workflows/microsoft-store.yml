name: Microsoft Store MSIX package

# Produces an unsigned, validated x64 MSIX for manual Partner Center upload.
# Microsoft signs the package after certification; this workflow never submits
# or publishes the listing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-store-msix-${{ github.ref }}
  cancel-in-progress: true

env:
  VOICESTUDIO_DISTRIBUTION: microsoft-store
  VOICESTUDIO_RUST_TARGET: x86_64-pc-windows-msvc
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/desktop-bridge -> target
          key: microsoft-store-msix-x64
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.13"
          enable-cache: false
      - name: Bundle pinned uv
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, copyFileSync } from 'node:fs';
          import { join } from 'node:path';
          if (`${process.platform}-${process.arch}` !== 'win32-x64') throw new Error('MSIX requires an x64 Windows runner');
          const source = execFileSync('where.exe', ['uv'], { encoding: 'utf8' }).trim().split(/\r?\n/)[0];
          const dir = 'electron/build/uv';
          mkdirSync(dir, { recursive: true });
          copyFileSync(source, join(dir, 'uv-x86_64-pc-windows-msvc.exe'));
          NODE
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate Store policy and Electron
        run: |
          node scripts/validate_store_foundation.mjs --distribution=microsoft-store
          bun run --cwd electron typecheck
          bun run --cwd electron test
          bun run --cwd electron build
          bun run --cwd electron build:web
          node electron/tests/packaging-contract.mjs
      - name: Build unsigned Store MSIX
        working-directory: electron
        run: |
          bun x electron-builder --config electron-builder.config.mjs --win appx --x64 --publish never
          node tests/packaging-contract.mjs --artifact
      - name: Verify MSIX identity and manifest
        shell: pwsh
        run: |
          $package = @(Get-ChildItem 'electron/release/VoiceStudio-MicrosoftStore-*-win-x64.msix')
          if ($package.Count -ne 1) { throw "Expected one x64 MSIX, found $($package.Count)" }
          ./scripts/verify_microsoft_store_msix.ps1 `
            -Package $package[0].FullName `
            -Output 'electron/release/msix-verification-win32-x64.json'
      - name: Install and launch a temporary self-signed copy
        # The Appx module is only supported by Windows PowerShell 5.1 on the runner.
        shell: powershell
        run: |
          $metadata = Get-Content store/metadata.json -Raw | ConvertFrom-Json
          $source = @(Get-ChildItem 'electron/release/VoiceStudio-MicrosoftStore-*-win-x64.msix')[0]
          $testPackage = Join-Path $env:RUNNER_TEMP 'VoiceStudio-Wack-x64.msix'
          Copy-Item $source.FullName $testPackage
          $cert = New-SelfSignedCertificate -Type Custom -KeyUsage DigitalSignature `
            -Subject $metadata.microsoftStore.publisher `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
            -FriendlyName 'VoiceStudio MSIX CI test'
          $cer = Join-Path $env:RUNNER_TEMP 'VoiceStudio-MSIX-CI.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) { throw 'SignTool is unavailable' }
          & $signTool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $testPackage
          if ($LASTEXITCODE -ne 0) { throw "Test signing failed: $LASTEXITCODE" }
          $processName = $null
          try {
            Add-Type -AssemblyName UIAutomationClient
            Add-AppxPackage -Path $testPackage
            $installed = Get-AppxPackage -Name $metadata.microsoftStore.identityName
            if ($null -eq $installed) { throw 'The test MSIX did not install' }
            $manifest = Get-AppxPackageManifest -Package $installed
            $application = @($manifest.Package.Applications.Application)[0]
            $processName = [System.IO.Path]::GetFileNameWithoutExtension($application.Executable)
            $aumid = "$($installed.PackageFamilyName)!$($application.Id)"
            Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$aumid"
            $deadline = (Get-Date).AddSeconds(60)
            $setupControl = $null
            $condition = [System.Windows.Automation.PropertyCondition]::new(
              [System.Windows.Automation.AutomationElement]::NameProperty,
              'Install local runtime'
            )
            do {
              Start-Sleep -Seconds 1
              $launched = Get-Process -Name $processName -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object -First 1
              if ($null -ne $launched) {
                try {
                  $window = [System.Windows.Automation.AutomationElement]::FromHandle(
                    [IntPtr]$launched.MainWindowHandle
                  )
                  $setupControl = $window.FindFirst(
                    [System.Windows.Automation.TreeScope]::Descendants,
                    $condition
                  )
                } catch {
                  $setupControl = $null
                }
              }
            } until ($null -ne $setupControl -or (Get-Date) -gt $deadline)
            if ($null -eq $setupControl) {
              throw "The installed MSIX did not render the setup screen: $aumid"
            }
          } finally {
            if ($null -ne $processName) {
              Get-Process -Name $processName -ErrorAction SilentlyContinue |
                Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Get-AppxPackage -Name $metadata.microsoftStore.identityName |
              Remove-AppxPackage -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
            Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          }
      - name: Run Windows App Certification Kit
        shell: powershell
        run: |
          $metadata = Get-Content store/metadata.json -Raw | ConvertFrom-Json
          $source = @(Get-ChildItem 'electron/release/VoiceStudio-MicrosoftStore-*-win-x64.msix')[0]
          $testPackage = Join-Path $env:RUNNER_TEMP 'VoiceStudio-Wack-x64.msix'
          Copy-Item $source.FullName $testPackage -Force
          $cert = New-SelfSignedCertificate -Type Custom -KeyUsage DigitalSignature `
            -Subject $metadata.microsoftStore.publisher `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') `
            -FriendlyName 'VoiceStudio WACK test'
          $cer = Join-Path $env:RUNNER_TEMP 'VoiceStudio-WACK.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signTool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $testPackage
          if ($LASTEXITCODE -ne 0) { throw "WACK test signing failed: $LASTEXITCODE" }
          $appCert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appCert)) { throw 'Windows App Certification Kit is unavailable' }
          $report = (Resolve-Path electron/release).Path + '\wack-win32-x64.xml'
          & $appCert reset
          & $appCert test -appxpackagepath $testPackage -reportoutputpath $report
          $exitCode = $LASTEXITCODE
          Get-AppxPackage -Name $metadata.microsoftStore.identityName |
            Remove-AppxPackage -ErrorAction SilentlyContinue
          Remove-Item "Cert:\LocalMachine\TrustedPeople\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) { throw "WACK failed: $exitCode" }
          if (-not (Test-Path $report)) { throw 'WACK did not produce a report' }
      - name: Record provenance
        working-directory: electron
        run: >-
          node ../scripts/create_store_artifact_manifest.mjs
          --distribution=microsoft-store --platform=win32 --arch=x64
          --signing-status=store-pending
          --signing-evidence=msix-verification-win32-x64.json
      - name: Create Partner Center handoff
        run: |
          node scripts/create_microsoft_store_handoff.mjs
          mkdir -p electron/release/listing/screenshots
          cp docs/logo.png electron/release/listing/box-art.png
          node --input-type=module <<'NODE'
          import { copyFileSync, readFileSync } from 'node:fs';
          import { basename, join } from 'node:path';
          const assets = JSON.parse(readFileSync('store/assets.json', 'utf8'));
          for (const screenshot of assets.screenshots) copyFileSync(screenshot.source, join('electron/release/listing/screenshots', basename(screenshot.source)));
          NODE
      - name: Save Partner Center handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: microsoft-store-partner-center-handoff
          retention-days: 30
          if-no-files-found: error
          path: |
            electron/release/VoiceStudio-MicrosoftStore-*-win-x64.msix
            electron/release/msix-verification-win32-x64.json
            electron/release/wack-win32-x64.xml
            electron/release/store-artifact-manifest-win32-x64.json
            electron/release/microsoft-store-submission.json
            electron/release/listing/
